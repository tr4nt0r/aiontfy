[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = ["TRY003","D202","D203", "D213", "D417", "ANN003",  "E501", "COM812", "ISC001", "TC003", "CPY"]


[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["aiontfy"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"types.py" = ["N815", "TCH003"]
"tests/*" = ["SLF001", "S101", "ARG001", "PLR2004", "DTZ001", "TC003"]
"*.ipynb" = ["T201", "ERA001"]

[tool.pytest.ini_options]
addopts = "--cov=src/aiontfy/ --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope="module"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "regex_commit"
commit_extra_args = ["-e"]
path = "src/aiontfy/const.py"

[tool.hatch.envs.default]
python = "3.14"
dependencies = [
    "ruff==0.16.7",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mkdocs-material==9.7.7",
    "mkdocstrings[python]==1.0.6",
    "pytest-asyncio==1.4.0",
    "aiohttp==3.14.3",
    "prek==0.5.2",
    "pyrefly==1.3.0",
]

[tool.hatch.envs.docs]
detached = true
dependencies = [
    "mkdocs-material==9.7.7",
    "mkdocstrings[python]==1.0.6",
]

[tool.hatch.envs.docs.scripts]
serve = "mkdocs serve"
build = "mkdocs build"

[tool.hatch.envs.hatch-test]
parallel = true
extra-dependencies = [
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
]
extra-args = ["--cov-report=xml", "-vv"]
type = "virtual"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.14", "3.13", "3.12"]

[tool.hatch.envs.hatch-static-analysis]
config-path = "none"
dependencies = ["ruff==0.16.7"]

[tool.hatch.envs.hatch-check-code]
config-path = "none"
dependencies = ["ruff==0.16.7"]

[tool.hatch.envs.hatch-check-fmt]
config-path = "none"
dependencies = ["ruff==0.16.7"]

[tool.hatch.envs.hatch-check-types]
dependencies = ["pyrefly==1.3.0", "pytest==9.1.1"]

[build-system]
requires = ["hatchling", "hatch-regex-commit"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiontfy"]

[tool.pyrefly]
project-includes = ["src/", "tests/"]
search-path = ["."]


[project]
name = "aiontfy"
authors = [
  { name = "Manfred Dennerlein Rodelo", email = "tr4nt0r@uber.space" }
]
description = "Async ntfy client library"
readme = "README.md"
dynamic = ["version"]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]
requires-python = ">=3.12"
dependencies = [
  "aiohttp~=3.11",
  "mashumaro~=3.13",
  "orjson>=3.11.7,<4.0",
]

[project.urls]
Documentation = "https://tr4nt0r.github.io/aiontfy/"
Source = "https://github.com/tr4nt0r/aiontfy"
